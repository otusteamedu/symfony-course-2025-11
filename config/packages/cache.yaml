framework:
    cache:
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_DSN)%'
        pools:
            doctrine.result_cache_pool:
                adapter: cache.adapter.memcached
                provider: '%env(MEMCACHED_DSN)%'
            doctrine.metadata_cache_pool:
                adapter: cache.adapter.memcached
                provider: '%env(MEMCACHED_DSN)%'